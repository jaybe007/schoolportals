# ==============================================================================
# EduSphere SaaS - Production Nginx Hardened Configuration
# Supports: Multi-Tenant Wildcards, Anti-DDoS, FastCGI PHP, & Zero-Day Isolation
# ==============================================================================

# Rate Limiting Zones (placed inside http block or included in server block)
limit_req_zone $binary_remote_addr zone=edusphere_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=edusphere_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com *.yourdomain.com;

    # Enforce HTTPS redirect for all traffic
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com *.yourdomain.com;

    root /var/www/schoolportals;
    index index.php index.html;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS Security & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Buffer Overflow & Request Size Limits
    client_body_buffer_size 128k;
    client_max_body_size 25M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' https: data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # 1. Deny access to hidden dotfiles (.env, .git, .gitignore, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Block direct access to sensitive backend directories & source files
    location ~ ^/(app|database|views|vendor|tests|config|deploy)/ {
        deny all;
        return 404;
    }

    # 3. Block sensitive extensions (.sql, .env, .lock, .json, .log, .md)
    location ~* \.(env|sql|lock|json|log|sh|phar|bak|config|dist|fla|inc|ini|psd|sw[op]|md|yml|yaml)$ {
        deny all;
        return 404;
    }

    # 4. Strictly prevent PHP execution in uploads/assets directory
    location ~* /(public/uploads|public/assets)/.*\.php$ {
        deny all;
        return 403;
    }

    # 5. Public Static Assets (Aggressive browser caching)
    location /public/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 6. Rate-limited Authentication Endpoint (Anti-Brute-Force)
    location = /login {
        limit_req zone=edusphere_login burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # 7. Front Controller Routing with General Rate Limiting
    location / {
        limit_req zone=edusphere_general burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 8. FastCGI PHP Execution
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY ""; # Mitigate HTTPOXY vulnerability
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        include fastcgi_params;
    }
}
